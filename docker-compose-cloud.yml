---
# Exchange-agnostic, pull-only cloud Compose stack for Freqtrade + Karakana Shadow Loop.
# Driven by .env (generated by scripts/deploy_cloud.sh) + optional .env.secrets (chmod 600).
#
# Usage on VPS:
#   docker compose -f docker-compose-cloud.yml pull
#   docker compose -f docker-compose-cloud.yml up -d --force-recreate

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  freqtrade:
    image: ${KARAKANA_IMAGE:-moinonin/freqtrade-karakana:1.0.7}
    init: true
    container_name: freqtrade-karakana
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env
        required: false
      - path: .env.secrets
        required: false
    environment:
      - KARAKANA_HISTORICAL_CHECKPOINT=/freqtrade/user_data/karakana_policy/watch/best_policy.pt
      - KARAKANA_HISTORICAL_PREPROCESSING=/freqtrade/user_data/karakana_policy/watch/offline_preprocessing.json
      - KARAKANA_HISTORICAL_THRESHOLD_GOVERNOR_ENABLED=${KARAKANA_HISTORICAL_THRESHOLD_GOVERNOR_ENABLED:-1}
      - KARAKANA_HISTORICAL_STRATEGY_HEALTH_PATH=/freqtrade/user_data/reports/directional_strategy_health.csv
      - KARAKANA_SHADOW_SIGNAL_EXPORT_PATH=/freqtrade/user_data/freqtrade_signals_karakana.csv
      - KARAKANA_HISTORICAL_REQUIRE_ARMED=${KARAKANA_HISTORICAL_REQUIRE_ARMED:-1}
      - KARAKANA_HISTORICAL_MIN_ARMED_ROWS=${KARAKANA_HISTORICAL_MIN_ARMED_ROWS:-8}
      - KARAKANA_HISTORICAL_MIN_ARMED_LONG_COUNT=${KARAKANA_HISTORICAL_MIN_ARMED_LONG_COUNT:-2}
      - KARAKANA_HISTORICAL_MIN_ARMED_SHORT_COUNT=${KARAKANA_HISTORICAL_MIN_ARMED_SHORT_COUNT:-2}
      - KARAKANA_HISTORICAL_MIN_ARMED_REGIME_CONFIDENCE=${KARAKANA_HISTORICAL_MIN_ARMED_REGIME_CONFIDENCE:-0.0}
      - KARAKANA_HISTORICAL_REQUIRE_POSITIVE_EV=${KARAKANA_HISTORICAL_REQUIRE_POSITIVE_EV:-0}
      - KARAKANA_HISTORICAL_MIN_SIDE_REWARD_MEAN=${KARAKANA_HISTORICAL_MIN_SIDE_REWARD_MEAN:-0.0}
      - FT_CONFIG=/freqtrade/user_data/${FT_CONFIG_FILE:-config.json}
      - FT_DB_URL=sqlite:////freqtrade/user_data/${FT_DB_FILE:-tradesv3.sqlite}
      - FT_LOG_FILE=/freqtrade/user_data/logs/freqtrade.log
      - FT_STRATEGY=${FT_STRATEGY:-Strategy322sgo}
      - FT_USER_DATA_DIR=/freqtrade/user_data
      # Configs hard-code 127.0.0.1:8080; bind the API to :8000 inside the
      # container so the published 127.0.0.1:8000 port actually reaches it.
      - FREQTRADE__API_SERVER__LISTEN_PORT=8000
      - FREQTRADE__API_SERVER__LISTEN_IP_ADDRESS=0.0.0.0
    volumes:
      - ./user_data:/freqtrade/user_data
    ports:
      - "127.0.0.1:8000:8000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /freqtrade/user_data/logs /freqtrade/user_data/reports &&
        test -f "/freqtrade/user_data/strategies/${FT_STRATEGY:-Strategy322sgo}.py" &&
        test -f "/freqtrade/user_data/${FT_CONFIG_FILE:-config.json}" &&
        test -f /freqtrade/user_data/karakana_policy/watch/best_policy.pt &&
        test -f /freqtrade/user_data/karakana_policy/watch/offline_preprocessing.json &&
        exec freqtrade trade
        --logfile /freqtrade/user_data/logs/freqtrade.log
        --db-url "sqlite:////freqtrade/user_data/${FT_DB_FILE:-tradesv3.sqlite}"
        --config "/freqtrade/user_data/${FT_CONFIG_FILE:-config.json}"
        --strategy "${FT_STRATEGY:-Strategy322sgo}"
    healthcheck:
      test: ["CMD-SHELL", "find /freqtrade/user_data/freqtrade_signals_karakana.csv -mmin -2 2>/dev/null | grep -q . || find /freqtrade/user_data/logs/freqtrade.log -mmin -2 2>/dev/null | grep -q ."]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    stop_grace_period: 60s

  karakana-shadow-trader:
    image: ${KARAKANA_IMAGE:-moinonin/freqtrade-karakana:1.0.7}
    init: true
    container_name: karakana-shadow-trader
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      - KARAKANA_SHADOW_SOURCE=/freqtrade/user_data/freqtrade_signals_karakana.csv
      - KARAKANA_SHADOW_POLICY_ROOT=/freqtrade/user_data/karakana_policy/watch
      - KARAKANA_SHADOW_OUTPUT_CSV=/freqtrade/user_data/reports/karakana_shadow_trade_history.csv
      - KARAKANA_SHADOW_STATE_PATH=/freqtrade/user_data/reports/karakana_shadow_trader_state.json
      - KARAKANA_SHADOW_HORIZON_ROWS=${KARAKANA_SHADOW_HORIZON_ROWS:-6}
      - KARAKANA_SHADOW_FEE_BPS=${KARAKANA_SHADOW_FEE_BPS:-5}
      - KARAKANA_SHADOW_LONG_THRESHOLD=${KARAKANA_SHADOW_LONG_THRESHOLD:-0.001}
      - KARAKANA_SHADOW_SHORT_THRESHOLD=${KARAKANA_SHADOW_SHORT_THRESHOLD:-0.001}
      - KARAKANA_SHADOW_ADMISSION_MODE=${KARAKANA_SHADOW_ADMISSION_MODE:-both}
      - KARAKANA_SHADOW_POLL_SECONDS=${KARAKANA_SHADOW_POLL_SECONDS:-15}
    volumes:
      - ./user_data:/freqtrade/user_data
    depends_on:
      freqtrade:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /freqtrade/user_data/reports &&
        command -v karakana-shadow-trader >/dev/null &&
        exec karakana-shadow-trader
        --watch
        --source /freqtrade/user_data/freqtrade_signals_karakana.csv
        --policy-root /freqtrade/user_data/karakana_policy/watch
        --output-csv /freqtrade/user_data/reports/karakana_shadow_trade_history.csv
        --state-path /freqtrade/user_data/reports/karakana_shadow_trader_state.json
        --horizon-rows "${KARAKANA_SHADOW_HORIZON_ROWS:-6}"
        --fee-bps "${KARAKANA_SHADOW_FEE_BPS:-5}"
        --long-threshold "${KARAKANA_SHADOW_LONG_THRESHOLD:-0.001}"
        --short-threshold "${KARAKANA_SHADOW_SHORT_THRESHOLD:-0.001}"
        --admission-mode "${KARAKANA_SHADOW_ADMISSION_MODE:-both}"
        --poll-seconds "${KARAKANA_SHADOW_POLL_SECONDS:-15}"
    healthcheck:
      test: ["CMD-SHELL", "find /freqtrade/user_data/reports/karakana_shadow_trade_history.csv -mmin -120 2>/dev/null | grep -q . || find /freqtrade/user_data/reports/karakana_shadow_trader_state.json -mmin -120 2>/dev/null | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 180s
    stop_grace_period: 30s

  karakana-shadow-health:
    image: ${KARAKANA_IMAGE:-moinonin/freqtrade-karakana:1.0.7}
    init: true
    container_name: karakana-shadow-health
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      - KARAKANA_HEALTH_SOURCE=/freqtrade/user_data/reports/karakana_shadow_trade_history.csv
      - KARAKANA_HEALTH_OUTPUT_CSV=/freqtrade/user_data/reports/directional_strategy_health.csv
      - KARAKANA_HEALTH_WINDOW_SIZE=${KARAKANA_HEALTH_WINDOW_SIZE:-8}
      - KARAKANA_HEALTH_WINDOW_STEP=${KARAKANA_HEALTH_WINDOW_STEP:-4}
      - KARAKANA_HEALTH_BASE_LONG_THRESHOLD=${KARAKANA_HEALTH_BASE_LONG_THRESHOLD:-0.001}
      - KARAKANA_HEALTH_BASE_SHORT_THRESHOLD=${KARAKANA_HEALTH_BASE_SHORT_THRESHOLD:-0.001}
      - KARAKANA_HEALTH_POLL_SECONDS=${KARAKANA_HEALTH_POLL_SECONDS:-15}
    volumes:
      - ./user_data:/freqtrade/user_data
    depends_on:
      karakana-shadow-trader:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /freqtrade/user_data/reports &&
        command -v karakana-shadow-health >/dev/null &&
        exec karakana-shadow-health
        --watch
        --source /freqtrade/user_data/reports/karakana_shadow_trade_history.csv
        --output-csv /freqtrade/user_data/reports/directional_strategy_health.csv
        --window-size "${KARAKANA_HEALTH_WINDOW_SIZE:-8}"
        --window-step "${KARAKANA_HEALTH_WINDOW_STEP:-4}"
        --base-long-threshold "${KARAKANA_HEALTH_BASE_LONG_THRESHOLD:-0.001}"
        --base-short-threshold "${KARAKANA_HEALTH_BASE_SHORT_THRESHOLD:-0.001}"
        --poll-seconds "${KARAKANA_HEALTH_POLL_SECONDS:-15}"
    healthcheck:
      test: ["CMD-SHELL", "find /freqtrade/user_data/reports/directional_strategy_health.csv -mmin -120 2>/dev/null | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 300s
    stop_grace_period: 30s

  # Periodic threshold sweep + runtime monitor. Runs the sidecar scripts baked
  # into the image under /freqtrade/karakana_tools, so the VPS needs no source
  # tree. It records recommendations only: the strategy already follows the
  # health CSV via the threshold governor, so patching compose and restarting
  # sidecars (APPLY / RESTART_SIDECARS) stay off by default. Enabling either
  # requires mounting the compose file and /var/run/docker.sock into this
  # service.
  karakana-threshold-scheduler:
    image: ${KARAKANA_IMAGE:-moinonin/freqtrade-karakana:1.0.7}
    init: true
    container_name: karakana-threshold-scheduler
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: .env
        required: false
    environment:
      - KARAKANA_THRESHOLD_SCHEDULER_APPLY=${KARAKANA_THRESHOLD_SCHEDULER_APPLY:-0}
      - KARAKANA_THRESHOLD_SCHEDULER_RESTART_SIDECARS=${KARAKANA_THRESHOLD_SCHEDULER_RESTART_SIDECARS:-0}
      # Run once at boot so the state file exists for the healthcheck, even
      # before enough signal rows accumulate for a real sweep.
      - KARAKANA_THRESHOLD_SCHEDULER_RUN_ON_START=${KARAKANA_THRESHOLD_SCHEDULER_RUN_ON_START:-1}
      - KARAKANA_THRESHOLD_SCHEDULER_MIN_SIGNAL_ROWS=${KARAKANA_THRESHOLD_SCHEDULER_MIN_SIGNAL_ROWS:-20000}
      - KARAKANA_THRESHOLD_SCHEDULER_MIN_NEW_ROWS=${KARAKANA_THRESHOLD_SCHEDULER_MIN_NEW_ROWS:-25000}
      - KARAKANA_THRESHOLD_SCHEDULER_TAIL_ROWS=${KARAKANA_THRESHOLD_SCHEDULER_TAIL_ROWS:-50000}
      - KARAKANA_THRESHOLD_SCHEDULER_DEFAULT_INTERVAL_SECONDS=${KARAKANA_THRESHOLD_SCHEDULER_DEFAULT_INTERVAL_SECONDS:-7200}
      - KARAKANA_THRESHOLD_SCHEDULER_INTERVAL_SECONDS_VALUES=${KARAKANA_THRESHOLD_SCHEDULER_INTERVAL_SECONDS_VALUES:-3600,7200,10800,21600}
      # Fee-aware sweep: pessimistic 5 bps round-trip + positive-EV gate.
      - KARAKANA_THRESHOLD_SCHEDULER_FEE_BPS=${KARAKANA_THRESHOLD_SCHEDULER_FEE_BPS:-5}
      - KARAKANA_THRESHOLD_SCHEDULER_MIN_REWARD_MEAN=${KARAKANA_THRESHOLD_SCHEDULER_MIN_REWARD_MEAN:-0.0}
      # Ranges sit on the cloud shadow thresholds (long 0.02 / short 0.07).
      - KARAKANA_THRESHOLD_SCHEDULER_LONG_RANGE=${KARAKANA_THRESHOLD_SCHEDULER_LONG_RANGE:-0.02:0.50:0.02}
      - KARAKANA_THRESHOLD_SCHEDULER_SHORT_RANGE=${KARAKANA_THRESHOLD_SCHEDULER_SHORT_RANGE:-0.05:0.60:0.05}
      - KARAKANA_THRESHOLD_SCHEDULER_HEALTH_WINDOW_SIZES=${KARAKANA_THRESHOLD_SCHEDULER_HEALTH_WINDOW_SIZES:-128,256,512,1024}
      - KARAKANA_THRESHOLD_SCHEDULER_HEALTH_WINDOW_STEPS=${KARAKANA_THRESHOLD_SCHEDULER_HEALTH_WINDOW_STEPS:-32,64,128,256}
      - KARAKANA_THRESHOLD_SCHEDULER_HEALTH_POLL_SECONDS_VALUES=${KARAKANA_THRESHOLD_SCHEDULER_HEALTH_POLL_SECONDS_VALUES:-60}
      - KARAKANA_THRESHOLD_SCHEDULER_MONITOR=${KARAKANA_THRESHOLD_SCHEDULER_MONITOR:-1}
      - KARAKANA_THRESHOLD_SCHEDULER_POLICY_RESET=${KARAKANA_THRESHOLD_SCHEDULER_POLICY_RESET:-1}
      - KARAKANA_THRESHOLD_SCHEDULER_POLICY_RESET_FORCE=${KARAKANA_THRESHOLD_SCHEDULER_POLICY_RESET_FORCE:-0}
      - KARAKANA_THRESHOLD_SCHEDULER_POLICY_RESET_ON_FIRST_SEEN=${KARAKANA_THRESHOLD_SCHEDULER_POLICY_RESET_ON_FIRST_SEEN:-0}
      - KARAKANA_RUNTIME_SIGNALS_MAX_ROWS=${KARAKANA_RUNTIME_SIGNALS_MAX_ROWS:-250000}
      - KARAKANA_RUNTIME_SHADOW_MAX_ROWS=${KARAKANA_RUNTIME_SHADOW_MAX_ROWS:-100000}
      - KARAKANA_RUNTIME_HEALTH_MAX_ROWS=${KARAKANA_RUNTIME_HEALTH_MAX_ROWS:-20000}
      - KARAKANA_RUNTIME_COUNT_TAIL_ROWS=${KARAKANA_RUNTIME_COUNT_TAIL_ROWS:-10000}
    volumes:
      - ./user_data:/freqtrade/user_data
    depends_on:
      freqtrade:
        condition: service_started
      karakana-shadow-trader:
        condition: service_started
      karakana-shadow-health:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /freqtrade/user_data/reports &&
        test -f /freqtrade/karakana_tools/threshold_scheduler.py &&
        exec python /freqtrade/karakana_tools/threshold_scheduler.py
        --repo-root /freqtrade
        --sweep-script /freqtrade/karakana_tools/sweep_live_shadow_thresholds.py
        --source /freqtrade/user_data/freqtrade_signals_karakana.csv
        --policy-root /freqtrade/user_data/karakana_policy/watch
        --output-csv /freqtrade/user_data/reports/karakana_live_threshold_sweep.csv
        --output-json /freqtrade/user_data/reports/karakana_live_threshold_sweep.json
        --state-json /freqtrade/user_data/reports/karakana_threshold_scheduler_state.json
        --log-file /freqtrade/user_data/reports/karakana_threshold_scheduler.log
        --monitor-script /freqtrade/karakana_tools/monitor_karakana_runtime.py
        --monitor-shadow-csv /freqtrade/user_data/reports/karakana_shadow_trade_history.csv
        --monitor-health-csv /freqtrade/user_data/reports/directional_strategy_health.csv
        --monitor-status-json /freqtrade/user_data/reports/karakana_runtime_status.json
        --monitor-archive-dir /freqtrade/user_data/reports/archive
        --monitor-signals-max-rows $${KARAKANA_RUNTIME_SIGNALS_MAX_ROWS:-250000}
        --monitor-shadow-max-rows $${KARAKANA_RUNTIME_SHADOW_MAX_ROWS:-100000}
        --monitor-health-max-rows $${KARAKANA_RUNTIME_HEALTH_MAX_ROWS:-20000}
        --monitor-count-tail-rows $${KARAKANA_RUNTIME_COUNT_TAIL_ROWS:-10000}
        --policy-reset-archive-dir /freqtrade/user_data/reports/archive
        --policy-reset-shadow-state /freqtrade/user_data/reports/karakana_shadow_trader_state.json
        --policy-reset-shadow-summary /freqtrade/user_data/reports/karakana_shadow_trade_history_summary.json
        --min-signal-rows $${KARAKANA_THRESHOLD_SCHEDULER_MIN_SIGNAL_ROWS:-20000}
        --min-new-rows-per-run $${KARAKANA_THRESHOLD_SCHEDULER_MIN_NEW_ROWS:-25000}
        --tail-rows $${KARAKANA_THRESHOLD_SCHEDULER_TAIL_ROWS:-50000}
        --fee-bps $${KARAKANA_THRESHOLD_SCHEDULER_FEE_BPS:-5}
        --min-reward-mean $${KARAKANA_THRESHOLD_SCHEDULER_MIN_REWARD_MEAN:-0.0}
        --long-thresholds $${KARAKANA_THRESHOLD_SCHEDULER_LONG_RANGE:-0.02:0.50:0.02}
        --short-thresholds $${KARAKANA_THRESHOLD_SCHEDULER_SHORT_RANGE:-0.05:0.60:0.05}
        --health-window-sizes $${KARAKANA_THRESHOLD_SCHEDULER_HEALTH_WINDOW_SIZES:-128,256,512,1024}
        --health-window-steps $${KARAKANA_THRESHOLD_SCHEDULER_HEALTH_WINDOW_STEPS:-32,64,128,256}
        --health-poll-seconds-values $${KARAKANA_THRESHOLD_SCHEDULER_HEALTH_POLL_SECONDS_VALUES:-60}
        --default-interval-seconds $${KARAKANA_THRESHOLD_SCHEDULER_DEFAULT_INTERVAL_SECONDS:-7200}
        --interval-seconds-values $${KARAKANA_THRESHOLD_SCHEDULER_INTERVAL_SECONDS_VALUES:-3600,7200,10800,21600}
        $$(test "$${KARAKANA_THRESHOLD_SCHEDULER_MONITOR:-1}" = "1" && printf %s " --monitor-enabled")
        $$(test "$${KARAKANA_THRESHOLD_SCHEDULER_POLICY_RESET:-1}" = "1" && printf %s " --policy-reset-enabled")
        $$(test "$${KARAKANA_THRESHOLD_SCHEDULER_POLICY_RESET_FORCE:-0}" = "1" && printf %s " --policy-reset-force")
        $$(test "$${KARAKANA_THRESHOLD_SCHEDULER_POLICY_RESET_ON_FIRST_SEEN:-0}" = "1" && printf %s " --policy-reset-on-first-seen")
        $$(test "$${KARAKANA_THRESHOLD_SCHEDULER_RUN_ON_START:-1}" = "1" && printf %s " --run-on-start")
        $$(test "$${KARAKANA_THRESHOLD_SCHEDULER_APPLY:-0}" = "1" && printf %s " --apply-compose --compose-file /freqtrade/user_data/docker-compose-cloud.yml")
        $$(test "$${KARAKANA_THRESHOLD_SCHEDULER_RESTART_SIDECARS:-0}" = "1" && printf %s " --restart-sidecars")
    healthcheck:
      test: ["CMD-SHELL", "find /freqtrade/user_data/reports/karakana_threshold_scheduler.log -mmin -300 2>/dev/null | grep -q . || find /freqtrade/user_data/reports/karakana_threshold_scheduler_state.json -mmin -300 2>/dev/null | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 10
      start_period: 120s
    stop_grace_period: 30s
